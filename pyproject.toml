[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptograph"
version = "0.3.2"
description = "Browse, diff, validate & generate AI system prompts (20,475 prompts from 55 repos) + FastMCP Server with 226 curated agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "4Pixel Tech", email = "4pixeltech@gmail.com" },
]
keywords = [
    "ai",
    "mcp",
    "mcp-server",
    "prompt-engineering",
    "system-prompts",
    "agent-skills",
    "fastmcp",
    "claude",
    "chatgpt",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/4pixeltechBR/promptograph"
Documentation = "https://4pixeltechBR.github.io/promptograph/"
Repository = "https://github.com/4pixeltechBR/promptograph"
Issues = "https://github.com/4pixeltechBR/promptograph/issues"
Changelog = "https://github.com/4pixeltechBR/promptograph/blob/main/CHANGELOG.md"

[project.scripts]
promptograph = "promptograph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptograph"]

[tool.hatch.build.targets.sdist]
include = [
    "src/promptograph",
    "README.md",
    "LICENSE",
]
